
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChargeSync</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: transparent;
  font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #f5faff;
  overflow: hidden;
}

.widget-container {
  width: 100%;
  height: 100vh;
  min-height: 420px;
  padding: 23px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;

  background: rgba(20, 29, 42, 0.68);
  backdrop-filter: blur(35px) saturate(160%);
  -webkit-backdrop-filter: blur(35px) saturate(160%);

  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 28px;

  box-shadow:
    0 12px 45px rgba(0,0,0,0.22),
    inset 0 1px 0 rgba(255,255,255,0.13);
}

.widget-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.08),
    transparent 42%,
    rgba(50,160,255,0.04)
  );
  pointer-events: none;
}

.drag-region {
  -webkit-app-region: drag;
}

.no-drag, button {
  -webkit-app-region: no-drag;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 2;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-logo {
  width: 35px;
  height: 35px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #8de3ff;
  font-size: 21px;
  background: rgba(51,174,238,0.15);
  border: 1px solid rgba(91,202,255,0.18);
}

.brand-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.brand-name span {
  color: #65cefa;
}

.version {
  font-size: 9px;
  color: rgba(220,235,250,0.45);
  letter-spacing: 1.1px;
  margin-top: 3px;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.device-label {
  color: rgba(220,235,250,0.52);
  font-size: 10px;
  letter-spacing: 1.7px;
  margin-bottom: 25px;
}

.battery-wrapper {
  width: 150px;
  height: 170px;
  display: grid;
  place-items: center;
  position: relative;
}

.battery-glow {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(42,179,255,0.16);
  filter: blur(48px);
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.65; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.12); }
}

.battery {
  position: relative;
  width: 82px;
  height: 137px;
  padding: 5px;
  border-radius: 19px;
  border: 2px solid rgba(125,210,255,0.65);
  background: rgba(10,35,53,0.42);
  box-shadow:
    0 0 25px rgba(43,180,255,0.18),
    inset 0 0 15px rgba(43,180,255,0.08);
}

.battery-cap {
  position: absolute;
  width: 29px;
  height: 5px;
  top: -7px;
  left: 24px;
  border-radius: 5px 5px 0 0;
  background: #65d6ff;
  box-shadow: 0 0 9px rgba(65,195,255,0.7);
}

.battery-fill {
  position: absolute;
  bottom: 5px;
  left: 5px;
  right: 5px;
  height: 76%;
  border-radius: 12px;
  background: linear-gradient(
    180deg,
    #9beaff,
    #45c5f5 48%,
    #168bd4
  );
  box-shadow: 0 0 20px rgba(52,190,255,0.38);
}

.battery-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    110deg,
    rgba(255,255,255,0.18),
    transparent 45%
  );
}

.percentage {
  display: flex;
  align-items: flex-start;
  gap: 2px;
  margin-top: 13px;
}

.percentage h1 {
  font-size: 59px;
  line-height: 1;
  font-weight: 650;
  letter-spacing: -4px;
}

.percentage span {
  color: #72d6ff;
  font-size: 21px;
  margin-top: 6px;
}

.battery-caption {
  color: rgba(220,235,250,0.52);
  font-size: 11px;
  margin-top: 7px;
}

.charging-status {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 17px;
  padding: 8px 13px;
  border-radius: 20px;
  color: #a9dfff;
  font-size: 10px;
  background: rgba(49,166,230,0.10);
  border: 1px solid rgba(90,190,255,0.12);
}

.charging-status .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5acbff;
  box-shadow: 0 0 7px #5acbff;
}

footer {
  position: relative;
  z-index: 2;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.09);
}

.device-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.device-icon {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #8bdcff;
  font-size: 17px;
  background: rgba(80,170,225,0.12);
  border: 1px solid rgba(255,255,255,0.07);
}

.device-details strong {
  font-size: 11px;
  font-weight: 600;
}

.device-details p {
  color: rgba(220,235,250,0.43);
  font-size: 9px;
  margin-top: 4px;
}

.connection {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 5px;
  color: #8ee4bd;
  font-size: 9px;
}

.connection span {
  font-size: 10px;
}

</style>
</head>

<body>
<div class="widget-container drag-region">

  <header>
    <div class="brand">
      <div class="brand-logo">ϟ</div>
      <div>
        <div class="brand-name">Charge<span>Sync</span></div>
        <div class="version">DESKTOP COMPANION</div>
      </div>
    </div>
  </header>

  <section class="main-content no-drag">
    <div class="device-label">PHONE BATTERY</div>

    <div class="battery-wrapper">
      <div class="battery-glow"></div>
      <div class="battery">
        <div class="battery-cap"></div>
        <div class="battery-fill"></div>
      </div>
    </div>

    <div class="percentage">
      <h1>84</h1><span>%</span>
    </div>

    <p class="battery-caption">Your device is looking healthy</p>

    <div class="charging-status">
      <span class="dot"></span>
      Discharging
    </div>
  </section>

  <footer class="no-drag">
    <div class="device-info">
      <div class="device-icon">⌘</div>
      <div class="device-details">
        <strong>Ubuntu Desktop</strong>
        <p>Desktop companion</p>
      </div>
      <div class="connection"><span>●</span> Connected</div>
    </div>


  </footer>

</div>
</body>
</html>
